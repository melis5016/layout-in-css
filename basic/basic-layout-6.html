<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Layout 6</title>
    <link rel="stylesheet" href="../style.css">
    <style>
      /* Doe hier jouw ding! */
      body{
        display: grid;
        gap: 1em;
        grid-template-columns: 5fr 12fr 6fr;
        grid-template-rows: 1fr 4fr;
        grid-template-areas: 
        "header header footer"
        "nav main footer";
      }

      main {
        grid-area: main;
      }

      footer {
        grid-area: footer;
      }

      header {
        grid-area: header;
      }

      footer {
        grid-area: footer;
      }

    </style>
  </head>
  <body id="basic-layout-6">
    <header><h1>Basic Layout 6</h1></header>
    <nav><a href="../index.html">Terug naar het overzicht</a></nav>
    <main></main>
    <footer></footer>
  </body>
</html>
