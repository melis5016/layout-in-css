<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Layout 9</title>
    <link rel="stylesheet" href="../style.css">
    <style>
      /* Doe hier jouw ding! */
      body {
        display: grid;
        gap: 1em;
        grid-template-columns: 1fr 3fr;
        grid-template-rows: 1fr 3fr 1fr;
        grid-template-areas: 
        "header nav"
        "main main"
        "footer footer";
      }

      main {
        grid-area: main;
      }

      nav {
        grid-area: nav;

        display: flex;
        justify-content: space-around;
        align-items: center;

        a{
          background-color: lightgray;
          padding: 1em;
          border: 2px solid black;
          border-radius: 1em;
        }
      }

      header {
        grid-area: header;
      }

      footer {
        grid-area: footer;
      }
    </style>
  </head>
  <body id="basic-layout-9">
    <header><h1>Basic Layout 9</h1></header>
    <nav>
      <a href="#">Home</a>
      <a href="#">Over ons</a>
      <a href="#">Contact</a>
    </nav>
    <main><a href="../index.html">Terug naar het overzicht</a></main>
    <footer></footer>
  </body>
</html>
